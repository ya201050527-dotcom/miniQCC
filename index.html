<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手術病人流程時間紀錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

<div class="max-w-4xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-200">
    
    <!-- Header Bar -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 pb-5 mb-6 gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-900">手術病人流程時間紀錄系統</h2>
            <p class="text-sm text-slate-500 mt-1">請先填寫基本資料（日期、病歷號、房間號）</p>
        </div>
        <div id="syncStatus" class="text-xs px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-medium transition-all duration-300">
            請先填寫基本資料
        </div>
    </div>

    <!-- Form Container -->
    <div id="formTab" class="tab-content">
        <form id="orForm" onsubmit="return false;" class="space-y-6">
            
            <!-- Basic Info Section -->
            <div>
                <h3 class="text-base font-semibold text-slate-700 mb-4 flex items-center">
                    <span class="w-1.5 h-4 bg-sky-500 rounded-full mr-2"></span>基本資料
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="flex flex-col">
                        <label for="surgeryDate" class="font-medium text-sm mb-1 text-slate-700">手術日期 *</label>
                        <input type="date" id="surgeryDate" required onchange="checkRequiredFields(); checkExistingPatientData();" class="p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div class="flex flex-col">
                        <label for="patientId" class="font-medium text-sm mb-1 text-slate-700">病歷號 *</label>
                        <input type="text" id="patientId" placeholder="請輸入病歷號" required oninput="debounceCheckPatient(); checkRequiredFields();" onblur="checkExistingPatientData(); checkRequiredFields();" class="p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div class="flex flex-col">
                        <label for="roomNo" class="font-medium text-sm mb-1 text-slate-700">房間號 *</label>
                        <input type="text" id="roomNo" placeholder="例：OR-03" required oninput="checkRequiredFields();" onblur="checkRequiredFields();" class="p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Timeline Fields Section -->
            <div>
                <h3 class="text-base font-semibold text-slate-700 mb-4 flex items-center">
                    <span class="w-1.5 h-4 bg-sky-500 rounded-full mr-2"></span>流程時間與備註
                </h3>
                <div id="timeFieldsContainer" class="space-y-3 opacity-50 pointer-events-none transition-opacity duration-300"></div>
            </div>

            <!-- Action Buttons Footer -->
            <div class="pt-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="text-xs text-slate-400">
                    * 點選「現在時間」即會自動將該欄位與備註同步至雲端
                </div>
                <button type="button" onclick="confirmComplete()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition-all duration-200 flex items-center gap-2 cursor-pointer z-10 w-full sm:w-auto justify-center">
                    ✅ 輸入完成
                </button>
            </div>

        </form>
    </div>

</div>

<!-- Custom Modal for Confirmation -->
<div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
        <h3 class="text-lg font-bold text-slate-900 mb-2">確認「輸入完成」？</h3>
        <p class="text-sm text-slate-600 mb-6 leading-relaxed">
            這將會清空您目前畫面的資料，讓您可以開始輸入下一位病人。<br><span class="text-emerald-600 font-medium">（雲端上的資料已自動儲存，其他同仁仍可繼續協作）</span>
        </p>
        <div class="flex justify-end gap-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-medium text-sm hover:bg-slate-50 transition-colors cursor-pointer">取消</button>
            <button type="button" onclick="executeClearForm()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm shadow-sm transition-colors cursor-pointer">確認清空</button>
        </div>
    </div>
</div>

<script>
    // Set default date to today
    document.getElementById('surgeryDate').valueAsDate = new Date();

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxX33ToaguLbH9oMAHNzz1qCezakfWGw15sIKwY9UyfzXLMAA64n4tLRqzGEL8gaTcT/exec';
    let debounceTimer = null;
    let isBasicInfoLocked = false;
    let isFetchingFromCloud = false;

    const timeSteps = [
        { 
            id: 'anesthesiaStart', 
            label: '1. 麻醉開始時間',
            hasIntubationType: true 
        },
        { id: 'anesthesiaEnd', label: '2. 麻醉結束時間' },
        { id: 'prepStart', label: '3. 專責開始準備時間' },
        { id: 'prepComplete', label: '4. 專責完成時間' },
        { id: 'surgeryEnd', label: '5. 手術結束時間' },
        { id: 'positionTransfer', label: '6. 術後病人翻身移床時間' },
        { id: 'extubation', label: '7. 術後麻醉甦醒拔管完成時間' },
        { id: 'leaveOR', label: '8. 病人離開手術室時間' },
        { id: 'enterRecovery', label: '9. 術後病人進入恢復室時間' },
        { id: 'nextPatientIn', label: '10. 下一台病人入房時間' }
    ];

    const container = document.getElementById('timeFieldsContainer');

    // Dynamically render time rows with clean stacked design
    timeSteps.forEach(step => {
        const row = document.createElement('div');
        row.className = 'bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col gap-3 transition-all hover:bg-slate-100/60';
        
        let extraHtml = '';
        if (step.hasIntubationType) {
            extraHtml = `
                <select id="intubationType" onchange="executeSync('anesthesiaStart')" class="p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none w-full sm:w-56">
                    <option value="">選擇插管分類...</option>
                    <option value="氣管插管">氣管插管</option>
                    <option value="double lumen氣管插管">double lumen氣管插管</option>
                </select>
            `;
        }

        row.innerHTML = `
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div class="font-semibold text-sm text-slate-700 flex-shrink-0">${step.label}</div>
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                    ${extraHtml}
                    <input type="time" id="${step.id}" class="p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none w-36">
                    <button type="button" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition-colors whitespace-nowrap shadow-sm cursor-pointer ml-auto sm:ml-0" onclick="setCurrentTimeAndSync('${step.id}')">現在時間</button>
                </div>
            </div>
            <div class="w-full pt-1">
                <input type="text" id="${step.id}Note" placeholder="備註 (選填)" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
        `;
        container.appendChild(row);
    });

    function checkRequiredFields() {
        const surgeryDate = document.getElementById('surgeryDate').value.trim();
        const patientId = document.getElementById('patientId').value.trim();
        const roomNo = document.getElementById('roomNo').value.trim();
        const container = document.getElementById('timeFieldsContainer');

        if (surgeryDate && patientId && roomNo) {
            container.classList.remove('opacity-50', 'pointer-events-none');
            if (!isBasicInfoLocked) {
                updateStatus('⚡ 準備就緒，點選「現在時間」後將同步至雲端', 'bg-emerald-100 text-emerald-800');
            }
            return true;
        } else {
            container.classList.add('opacity-50', 'pointer-events-none');
            updateStatus('⚠️ 請先完整填寫手術日期、病歷號與房間號', 'bg-amber-100 text-amber-800');
            return false;
        }
    }

    function lockBasicInfo() {
        isBasicInfoLocked = true;
        const dateInput = document.getElementById('surgeryDate');
        const patientIdInput = document.getElementById('patientId');
        const roomNoInput = document.getElementById('roomNo');

        dateInput.readOnly = true;
        patientIdInput.readOnly = true;
        roomNoInput.readOnly = true;

        dateInput.classList.add('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
        patientIdInput.classList.add('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
        roomNoInput.classList.add('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
    }

    function updateStatus(text, bgClass) {
        const badge = document.getElementById('syncStatus');
        badge.className = `text-xs px-3 py-1.5 rounded-full font-medium transition-all duration-300 ${bgClass}`;
        badge.innerText = text;
    }

    function setCurrentTimeAndSync(fieldId) {
        if (!checkRequiredFields()) return;

        lockBasicInfo();

        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById(fieldId).value = `${hours}:${minutes}`;
        
        executeSync(fieldId);
    }

    function debounceCheckPatient() {
        if (isBasicInfoLocked || isFetchingFromCloud) return;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            checkExistingPatientData();
        }, 500);
    }

    function checkExistingPatientData() {
        if (isBasicInfoLocked || isFetchingFromCloud) return;

        const patientId = document.getElementById('patientId').value.trim();
        const surgeryDate = document.getElementById('surgeryDate').value;

        if (!patientId || !surgeryDate) return;

        isFetchingFromCloud = true;
        updateStatus('🔍 正在載入該病人紀錄...', 'bg-sky-100 text-sky-800');

        fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
            isFetchingFromCloud = false;
            if (!Array.isArray(data)) return;

            const matched = data.find(item => {
                let dateStr = String(item["手術日期"] || "").trim().substring(0, 10).replace(/\//g, "-");
                return dateStr === surgeryDate && String(item["病歷號"] || "").trim() === patientId;
            });

            if (matched) {
                if (matched["房間號"] && !document.getElementById('roomNo').value) {
                    document.getElementById('roomNo').value = matched["房間號"];
                }

                // Intubation type sync
                const intubSelect = document.getElementById('intubationType');
                const intubVal = matched["插管分類"];
                if (intubSelect && !intubSelect.value && intubVal !== undefined && intubVal !== null && String(intubVal).trim() !== "") {
                    intubSelect.value = String(intubVal).trim();
                }

                const timeKeyMap = {
                    'anesthesiaStart': '麻醉開始時間',
                    'anesthesiaEnd': '麻醉結束時間',
                    'prepStart': '專責開始準備時間',
                    'prepComplete': '專責完成時間',
                    'surgeryEnd': '手術結束時間',
                    'positionTransfer': '術後病人翻身移床時間',
                    'extubation': '術後麻醉甦醒拔管完成時間',
                    'leaveOR': '病人離開手術室時間',
                    'enterRecovery': '術後病人進入恢復室時間',
                    'nextPatientIn': '下一台病人入房時間'
                };
                const noteKeyMap = {
                    'anesthesiaStart': '麻醉開始備註',
                    'anesthesiaEnd': '麻醉結束備註',
                    'prepStart': '專責開始準備備註',
                    'prepComplete': '專責完成備註',
                    'surgeryEnd': '手術結束備註',
                    'positionTransfer': '術後病人翻身移床備註',
                    'extubation': '術後麻醉甦醒拔管完成備註',
                    'leaveOR': '病人離開手術室備註',
                    'enterRecovery': '術後病人進入恢復室備註',
                    'nextPatientIn': '下一台病人入房備註'
                };

                timeSteps.forEach(step => {
                    const tInput = document.getElementById(step.id);
                    const nInput = document.getElementById(step.id + 'Note');
                    const tVal = matched[timeKeyMap[step.id]];
                    const nVal = matched[noteKeyMap[step.id]];
                    
                    if (!tInput.value && tVal !== undefined && tVal !== null && String(tVal).trim() !== "") {
                        tInput.value = String(tVal).trim();
                    }
                    if (!nInput.value && nVal !== undefined && nVal !== null && String(nVal).trim() !== "") {
                        nInput.value = String(nVal).trim();
                    }
                });

                updateStatus('✅ 已成功載入該病人之同列紀錄', 'bg-emerald-100 text-emerald-800');
            } else {
                updateStatus('⚡ 準備就緒（此病歷號為新紀錄）', 'bg-slate-100 text-slate-600');
            }
            checkRequiredFields();
        })
        .catch(err => {
            isFetchingFromCloud = false;
            console.error(err);
            updateStatus('⚠️ 無法自動載入雲端資料', 'bg-amber-100 text-amber-800');
        });
    }

    function executeSync(updatedFieldId) {
        const patientId = document.getElementById('patientId').value.trim();
        const surgeryDate = document.getElementById('surgeryDate').value;
        const roomNo = document.getElementById('roomNo').value.trim();

        if (!surgeryDate || !patientId || !roomNo) {
            return;
        }

        lockBasicInfo();
        updateStatus('⚡ 正在同步至同列...', 'bg-sky-100 text-sky-800');

        const payload = {
            surgeryDate: surgeryDate,
            patientId: patientId,
            roomNo: roomNo
        };

        const intubSelect = document.getElementById('intubationType');
        if (intubSelect) {
            payload.intubationType = intubSelect.value;
        }

        timeSteps.forEach(step => {
            payload[step.id] = document.getElementById(step.id).value;
            payload[step.id + 'Note'] = document.getElementById(step.id + 'Note').value;
        });

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            updateStatus('✅ 已成功同步至該病人同列', 'bg-emerald-100 text-emerald-800');
        })
        .catch(err => {
            console.error(err);
            updateStatus('❌ 同步失敗', 'bg-rose-100 text-rose-800');
        });
    }

    function confirmComplete() {
        document.getElementById('confirmModal').classList.remove('hidden');
        document.getElementById('confirmModal').classList.add('flex');
    }

    function closeModal() {
        document.getElementById('confirmModal').classList.remove('flex');
        document.getElementById('confirmModal').classList.add('hidden');
    }

    function executeClearForm() {
        closeModal();
        isBasicInfoLocked = false;
        const dateInput = document.getElementById('surgeryDate');
        const patientIdInput = document.getElementById('patientId');
        const roomNoInput = document.getElementById('roomNo');

        dateInput.readOnly = false;
        patientIdInput.readOnly = false;
        roomNoInput.readOnly = false;

        dateInput.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
        patientIdInput.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
        roomNoInput.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');

        dateInput.valueAsDate = new Date();
        patientIdInput.value = '';
        roomNoInput.value = '';

        const intubSelect = document.getElementById('intubationType');
        if (intubSelect) intubSelect.value = '';

        timeSteps.forEach(step => {
            document.getElementById(step.id).value = '';
            document.getElementById(step.id + 'Note').value = '';
        });
        
        patientIdInput.focus();
        checkRequiredFields();
        updateStatus('⚡ 請先填寫基本資料', 'bg-slate-100 text-slate-600');
    }
</script>

</body>
</html>
